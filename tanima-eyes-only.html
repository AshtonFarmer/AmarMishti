<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Tanima Eyes Only ❤️</title>
  <link rel="stylesheet" href="tanima-eyes-only.css?v=1" />
  <link rel="stylesheet" href="cursor.css?v=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="shortcut icon" href="favicon.svg?v=2">
</head>
<body>
<main class="eyes-page">
  <div class="soft-vignette"></div>
  <div class="paper-grain"></div>
  <div class="quiet-particles" aria-hidden="true"></div>
  <section class="eyes-intro">
    <p class="private-label">A private universe</p>
    <h1>Tanima Eyes Only</h1>
    <p class="intro-line">No multiverse noise. No jokes. Just something from my heart to yours.</p>
  </section>
  <section class="letter-stage" aria-label="Envelope opening into a video">
    <div class="envelope-scene">
      <button id="openLetterBtn" class="open-letter-btn" type="button" aria-label="Open when you are ready">
        <span class="envelope">
          <span class="envelope-back"></span>
          <span class="letter-paper">
            <span class="paper-glow"></span>
            <span class="paper-line line-1"></span>
            <span class="paper-line line-2"></span>
            <span class="paper-line line-3"></span>
            <span class="paper-heart">❤️</span>
          </span>
          <span class="envelope-front"></span>
          <span class="envelope-flap"></span>
          <span class="wax-seal">❤️</span>
        </span>
      </button>
      <p class="open-hint">Open when you’re ready ❤️</p>
    </div>
    <div class="video-shell" id="videoShell" aria-hidden="true">
      <div class="video-frame">
        <video id="heartVideo" class="heart-video" controls playsinline preload="metadata">
          <source src="tanima-eyes-only.mp4" type="video/mp4" />
        </video>
      </div>
      <p class="video-note">This is me speaking from my heart.</p>
    </div>
    <div class="closed-envelope" aria-hidden="true">
      <div class="closed-card"><div class="tiny-envelope">💌</div><p>Kept safely in this little universe.</p></div>
    </div>
    <a id="returnBts" class="return-bts hidden-eyes" href="ending.html?behind=1">Return to behind the scenes ❤️</a>
  </section>
</main>
<script src="tanima-eyes-only.js?v=1"></script>
</body>
</html>
