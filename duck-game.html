<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Secret Duck Universe 🦆⚡</title>
<link rel="stylesheet" href="duck-game.css?v=2" />
<link rel="stylesheet" href="duck-resort.css?v=1" />
<link rel="stylesheet" href="cursor.css?v=1" />
</head>
<body>
<main class="duck-page">
  <div class="duck-stars"></div>
  <div class="duck-glow"></div>

  <section class="duck-card">
    <p class="duck-kicker">Secret universe unlocked</p>
    <h1>Duck Dash 🦆⚡</h1>
    <p class="duck-intro">Help the multiverse duck collect bread and hearts. Avoid puddles.</p>

    <div class="duck-hud">
      <div>Score: <span id="score">0</span></div>
      <div>Time: <span id="time">30</span>s</div>
      <div>Goal: <span id="goal">12</span></div>
    </div>

    <section id="gameArena" class="game-arena">
      <div id="duckPlayer" class="duck-player">
        <div class="duck-body"></div>
        <div class="duck-head"></div>
        <div class="duck-beak"></div>
        <div class="duck-eye"></div>
        <div class="duck-wing"></div>
        <div class="duck-foot foot-one"></div>
        <div class="duck-foot foot-two"></div>
      </div>

      <div id="duckJoystick" class="duck-joystick" aria-label="Duck joystick">
        <div class="joystick-ring">
          <div id="joystickThumb" class="joystick-thumb">⚡</div>
        </div>
        <span class="joystick-label">drag to waddle</span>
      </div>
    </section>

    <p id="duckMessage" class="duck-message">Use arrow keys, WASD, or the mobile joystick. Collect 🍞 and ❤️. Avoid 💧.</p>

    <div class="duck-buttons">
      <button id="startDuckGame" class="duck-btn">Start duck chaos 🦆</button>
      <a class="duck-return" href="index.html?duckReturn=1">Back to video universe ❤️</a>
    </div>
  </section>
</main>

<script src="duck-game.js?v=2"></script>
</body>
</html>
