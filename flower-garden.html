<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Flower Garden Universe ❤️</title>
  <link rel="stylesheet" href="flower-garden.css?v=1" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg?v=2">
  <link rel="shortcut icon" href="favicon.svg?v=2">
  <link rel="stylesheet" href="cursor.css?v=1" />
</head>
<body>

<main class="garden-page">
  <div class="garden-stars"></div>
  <div class="garden-glow"></div>
  <div class="petal-rain"></div>

  <section class="garden-card">
    <p class="garden-kicker">A gentle universe</p>
    <h1>Walk through our garden.</h1>
    <p class="garden-quote">
      After every storm, I would still choose to bloom beside you.
    </p>

    <button id="bloomBtn" class="bloom-btn">Tap to bloom the garden 🌸</button>

    <a id="gardenReturn" class="garden-return hidden-garden" href="ending.html">
      Return to our universe ❤️
    </a>
  </section>

  <section id="flowerField" class="flower-field" aria-hidden="true">
    <div class="flower flower-1">
      <div class="stem"></div>
      <div class="bloom">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="flower flower-2">
      <div class="stem"></div>
      <div class="bloom">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="flower flower-3">
      <div class="stem"></div>
      <div class="bloom">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="flower flower-4">
      <div class="stem"></div>
      <div class="bloom">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>

    <div class="flower flower-5">
      <div class="stem"></div>
      <div class="bloom">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
    </div>
  </section>
</main>

<script src="flower-garden.js?v=1"></script>
</body>
</html>
