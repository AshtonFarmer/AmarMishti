<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Rain Universe ❤️</title>
  <link rel="stylesheet" href="rain-universe.css?v=visiblerain1" />
</head>
<body>
<audio id="rainSong" loop>
  <source src="rain-song.mp3" type="audio/mpeg">
</audio>

<main class="rain-page">
  <div class="rain-sky"></div>
  <div class="rain-layer"></div>
  <div class="heavy-rain visible-rain"></div>
  <div class="rain-layer rain-layer-soft"></div>
  <div class="window-glass"></div>
  <div class="lightning-flash"></div>

  <section class="rain-card">
    <p class="rain-kicker">A quiet universe</p>

    <div class="memory-window">
      <video id="rainVideo" class="rain-video" muted loop playsinline preload="metadata">
        <source src="rain-video.mp4" type="video/mp4">
      </video>
      <div class="video-glow"></div>
    </div>

    <h1>Even the storm feels peaceful with you.</h1>

    <p id="rainQuote" class="rain-quote">
      Rain always feels better when it reminds me of you.
    </p>

    <button id="rainStartBtn" class="rain-start">Tap to enter the rain ❤️</button>

    <a class="rain-return hidden-rain" id="rainReturn" href="ending.html">
      Return to our universe ❤️
    </a>
  </section>

  <div class="rain-bottom-message">
    You make me happy, even in the dark and stormy nights.
  </div>
</main>

<script src="rain-universe.js?v=visiblerain1"></script>
</body>
</html>
